<!-- Small screens: top bar with a menu button -->
<header class="topbar">
  <button
    class="topbar__menu"
    type="button"
    aria-label="Open menu"
    aria-controls="sidebar"
    [attr.aria-expanded]="isMenuOpen()"
    (click)="isMenuOpen.set(true)"
  >
    <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true">
      <path
        d="M3 5.5h14M3 10h14M3 14.5h14"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>
  <a class="topbar__logo" routerLink="/dashboard">
    <img src="logo.svg" alt="" width="28" height="28" />
    <span>TalentFlow</span>
  </a>
</header>

@if (isMenuOpen()) {
  <div class="scrim" aria-hidden="true" (click)="isMenuOpen.set(false)"></div>
}

<aside id="sidebar" class="side" [class.is-open]="isMenuOpen()">
  <div class="side__top">
    <a class="logo" routerLink="/dashboard">
      <img src="logo-light.svg" alt="" width="32" height="32" />
      <span>TalentFlow</span>
    </a>
    <button
      class="side__close"
      type="button"
      aria-label="Close menu"
      (click)="isMenuOpen.set(false)"
    >
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path
          d="M5 5l10 10M15 5L5 15"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>

  <nav class="nav" aria-label="Main">
    <p class="nav__label">Hiring</p>

    <a routerLink="/dashboard" routerLinkActive="is-active">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3.5 9L10 3.5 16.5 9v7.5h-4.5v-4.5h-4v4.5H3.5z" />
      </svg>
      Dashboard
    </a>
    <a routerLink="/postings" routerLinkActive="is-active">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="3" y="6" width="14" height="10.5" rx="2" />
        <path d="M7.5 6V4.5h5V6M3 10.5h14" />
      </svg>
      Job postings
    </a>
    <a routerLink="/applications" routerLinkActive="is-active">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8" cy="7" r="3" />
        <path d="M2.5 16.5c.6-2.8 2.8-4.5 5.5-4.5s4.9 1.7 5.5 4.5" />
        <path d="M13 4.2a3 3 0 0 1 0 5.6M15 12.3c1.3.7 2.2 2.2 2.5 4.2" />
      </svg>
      Applications
    </a>

    @if (auth.hasRole(UserRole.MANAGER)) {
      <p class="nav__label">Admin</p>
      <a routerLink="/team" routerLinkActive="is-active">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="7" r="3.2" />
          <path d="M4 16.5c.6-3 3-4.8 6-4.8s5.4 1.8 6 4.8" />
        </svg>
        Team accounts
      </a>
    }
  </nav>

  <div class="side__bottom">
    <div class="account">
      <span class="account__avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="account__text">
        <span class="account__name">{{ auth.fullName() }}</span>
        <span class="account__role">{{ roleLabel() }}</span>
      </span>
    </div>
    <button class="logout" type="button" (click)="auth.logout()">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M8 4H5a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 5 16h3" />
        <path d="M12 6.5L15.5 10 12 13.5M15.5 10H8" />
      </svg>
      Sign out
    </button>
  </div>
</aside>

<main class="content">
  <router-outlet />
</main>
