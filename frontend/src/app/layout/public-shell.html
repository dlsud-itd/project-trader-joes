<header class="bar">
  <div class="bar__inner">
    <a class="logo" routerLink="/careers">
      <img src="logo.svg" alt="" width="32" height="32" />
      <span class="logo__name">TalentFlow</span>
      <span class="logo__tag">Careers</span>
    </a>
    <div class="actions">
      @if (auth.hasRole(UserRole.APPLICANT)) {
        <span class="account">
          <span class="account__avatar" aria-hidden="true">{{
            initials()
          }}</span>
          Hi, {{ auth.user()?.first_name }}
        </span>
        <button
          class="tf-btn tf-btn--ghost tf-btn--sm"
          type="button"
          (click)="auth.logout()"
        >
          Sign out
        </button>
      } @else {
        <a class="staff" routerLink="/login">Staff sign in</a>
        @if (!auth.isAuthenticated()) {
          <a class="tf-btn tf-btn--ghost tf-btn--sm" routerLink="/careers/login"
            >Sign in</a
          >
          <a
            class="tf-btn tf-btn--primary tf-btn--sm"
            routerLink="/careers/register"
          >
            Create account
          </a>
        }
      }
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<footer class="foot">
  <p>© {{ year }} Trader Joe’s · TalentFlow</p>
</footer>
