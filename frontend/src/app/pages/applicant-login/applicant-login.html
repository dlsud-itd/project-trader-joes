<header class="head">
  <h1>Sign in</h1>
  <p>For applicants tracking their job application.</p>
</header>

<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as message) {
    <div class="tf-alert tf-alert--error" role="alert">{{ message }}</div>
  }

  <div class="tf-field">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      formControlName="email"
      placeholder="you@example.com"
      [class.is-invalid]="showError('email')"
      [attr.aria-invalid]="showError('email')"
    />
    @if (showError('email')) {
      <span class="tf-error">Enter a valid email address.</span>
    }
  </div>

  <div class="tf-field">
    <label for="password">Password</label>
    <div class="password">
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        autocomplete="current-password"
        formControlName="password"
        [class.is-invalid]="showError('password')"
        [attr.aria-invalid]="showError('password')"
      />
      <button
        type="button"
        class="password__toggle"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        {{ showPassword() ? 'Hide' : 'Show' }}
      </button>
    </div>
    @if (showError('password')) {
      <span class="tf-error">Enter your password.</span>
    }
  </div>

  <button class="tf-btn tf-btn--primary" type="submit" [disabled]="submitting()">
    @if (submitting()) {
      <span class="tf-spinner" aria-hidden="true"></span>
      Signing in…
    } @else {
      Sign in
    }
  </button>

  <p class="card__note">New here? <a routerLink="/careers/register">Create an account</a></p>
</form>
