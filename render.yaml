# Render Blueprint for the backend API.
# In Render: New > Blueprint > pick this repo. Then fill in the variables marked sync: false.
services:
  - type: web
    name: talentflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Applies database migrations (and seeds sample accounts on an empty database), then starts the API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGINS
        sync: false # e.g. https://talentflow.appwrite.network,http://localhost:4200
      - key: GEMINI_API_KEY
        sync: false # from https://aistudio.google.com/apikey
      - key: RESEND_API_KEY
        sync: false # from https://resend.com/api-keys; empty turns email off
      - key: EMAIL_FROM
        sync: false # optional, e.g. TalentFlow <jobs@yourdomain.com>
      # Resume files (Appwrite Storage). Leave unset to keep them in Neon.
      - key: APPWRITE_ENDPOINT
        sync: false # e.g. https://fra.cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_RESUMES_BUCKET_ID
        sync: false # the resumes bucket's id
      - key: APPWRITE_API_KEY
        sync: false # server key with files.read and files.write
